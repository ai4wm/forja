<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forja Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171923;
      --panel-2: #1f2330;
      --text: #e6e8ef;
      --muted: #9aa3b2;
      --line: #2b3140;
      --blue: #4da3ff;
      --red: #ff6b6b;
      --green: #3ddc97;
      --yellow: #f7c948;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #182033 0%, var(--bg) 55%);
      color: var(--text);
    }
    header {
      padding: 20px 24px 8px;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .subtitle { color: var(--muted); font-size: 14px; }
    .tabs {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .tab-button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    .tab-button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #071220;
      font-weight: 600;
    }
    main {
      padding: 24px;
      display: grid;
      gap: 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .hidden { display: none; }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    input, select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
    }
    .debate-list {
      display: grid;
      gap: 10px;
      max-height: 70vh;
      overflow: auto;
    }
    .debate-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-2);
      cursor: pointer;
    }
    .debate-item.active {
      border-color: var(--blue);
      box-shadow: inset 0 0 0 1px var(--blue);
    }
    .transcript {
      display: grid;
      gap: 12px;
      max-height: 70vh;
      overflow: auto;
    }
    .bubble {
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.5;
      border: 1px solid var(--line);
      background: var(--panel-2);
    }
    .bubble.diverge { border-left: 4px solid var(--blue); }
    .bubble.conflict { border-left: 4px solid var(--red); }
    .bubble.converge { border-left: 4px solid var(--green); }
    .bubble-header {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .budget-grid {
      display: grid;
      gap: 14px;
    }
    .budget-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-2);
    }
    .budget-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .bar {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: #0b0d13;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: #d7deea;
    }
    @media (max-width: 960px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Forja 로컬 대시보드</h1>
    <div class="subtitle">
      audit.db 기반 실시간 모니터링 · 5초 자동 새로고침 ·
      <span id="telegram-status">Telegram: Disconnected</span>
    </div>
    <div class="tabs">
      <button class="tab-button active" data-tab="audit">Audit Log</button>
      <button class="tab-button" data-tab="debates">Debates</button>
      <button class="tab-button" data-tab="budget">Budget</button>
      <button class="tab-button" data-tab="tasks">Tasks</button>
    </div>
  </header>

  <main>
    <section id="tab-audit" class="panel">
      <div class="toolbar">
        <label>이벤트 타입
          <input id="audit-filter" placeholder="예: debate_message">
        </label>
        <label>표시 개수
          <select id="audit-limit">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>
      <table>
        <thead>
          <tr>
            <th>시간</th>
            <th>이벤트</th>
            <th>에이전트</th>
            <th>토큰</th>
            <th>페이로드</th>
          </tr>
        </thead>
        <tbody id="audit-body"></tbody>
      </table>
    </section>

    <section id="tab-debates" class="panel hidden">
      <div class="grid">
        <div>
          <div class="muted" style="margin-bottom:10px;">토론 목록</div>
          <div id="debate-list" class="debate-list"></div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:10px;">토론 transcript</div>
          <div id="transcript" class="transcript"></div>
        </div>
      </div>
    </section>

    <section id="tab-budget" class="panel hidden">
      <div id="budget-grid" class="budget-grid"></div>
    </section>

    <section id="tab-tasks" class="panel hidden">
      <div class="grid">
        <div>
          <div class="muted" style="margin-bottom:10px;">태스크 큐</div>
          <div id="task-list" class="debate-list"></div>
        </div>
        <div style="display:grid; gap:16px;">
          <div>
            <div class="muted" style="margin-bottom:10px;">스킬 목록</div>
            <div id="skills-list" class="debate-list"></div>
          </div>
          <div>
            <div class="muted" style="margin-bottom:10px;">미해결 문제</div>
            <div id="unresolved-list" class="debate-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const tabs = document.querySelectorAll(".tab-button");
    const sections = {
      audit: document.getElementById("tab-audit"),
      debates: document.getElementById("tab-debates"),
      budget: document.getElementById("tab-budget"),
      tasks: document.getElementById("tab-tasks")
    };

    tabs.forEach((button) => {
      button.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        Object.values(sections).forEach((section) => section.classList.add("hidden"));
        sections[button.dataset.tab].classList.remove("hidden");
      });
    });

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    async function loadAudit() {
      const filter = document.getElementById("audit-filter").value.trim();
      const limit = document.getElementById("audit-limit").value;
      const query = new URLSearchParams({ limit });
      if (filter) {
        query.set("event_type", filter);
      }
      const rows = await fetchJson(`/api/audit?${query.toString()}`);
      const body = document.getElementById("audit-body");
      body.innerHTML = rows.map((row) => `
        <tr>
          <td>${row.timestamp}</td>
          <td>${row.event_type}</td>
          <td>${row.agent_id}</td>
          <td>${row.token_count}</td>
          <td><pre>${JSON.stringify(row.payload, null, 2)}</pre></td>
        </tr>
      `).join("");
    }

    async function loadDebates() {
      const debates = await fetchJson("/api/debates");
      const list = document.getElementById("debate-list");
      list.innerHTML = debates.map((debate, index) => `
        <div class="debate-item ${index === 0 ? "active" : ""}" data-id="${debate.id}">
          <div><strong>${debate.started_at}</strong></div>
          <div class="muted">메시지 ${debate.message_count}개</div>
          <div>${debate.preview || "(미리보기 없음)"}</div>
        </div>
      `).join("");

      document.querySelectorAll(".debate-item").forEach((item) => {
        item.addEventListener("click", async () => {
          document.querySelectorAll(".debate-item").forEach((node) => node.classList.remove("active"));
          item.classList.add("active");
          await loadDebateTranscript(item.dataset.id);
        });
      });

      if (debates.length > 0) {
        await loadDebateTranscript(debates[0].id);
      } else {
        document.getElementById("transcript").innerHTML = '<div class="muted">토론 기록이 없습니다.</div>';
      }
    }

    async function loadDebateTranscript(id) {
      const transcript = await fetchJson(`/api/debate/${id}`);
      const container = document.getElementById("transcript");
      container.innerHTML = transcript.map((message) => {
        const phaseClass = message.phase.toLowerCase();
        return `
          <div class="bubble ${phaseClass}">
            <div class="bubble-header">[${message.phase}][R${message.round}] ${message.role} · ${message.timestamp}</div>
            <div>${message.content}</div>
          </div>
        `;
      }).join("");
    }

    async function loadBudget() {
      const rows = await fetchJson("/api/budget");
      const grid = document.getElementById("budget-grid");
      grid.innerHTML = rows.map((row) => `
        <div class="budget-card">
          <div class="budget-row">
            <strong>${row.agent_id}</strong>
            <span>${row.used_tokens} / ${row.monthly_limit}</span>
          </div>
          <div class="bar">
            <div class="bar-fill" style="width:${Math.min(row.percent, 100)}%"></div>
          </div>
          <div class="budget-row" style="margin-top:8px;">
            <span class="muted">월 키: ${row.month_key}</span>
            <span>${row.percent}%</span>
          </div>
        </div>
      `).join("");
    }

    async function approveTask(id) {
      await fetch(`/api/approve/${id}`, { method: "POST" });
      await loadTasks();
    }

    async function loadTasks() {
      const [tasks, skills, unresolved] = await Promise.all([
        fetchJson("/api/tasks"),
        fetchJson("/api/skills"),
        fetchJson("/api/unresolved")
      ]);
      const statusColor = (status) => {
        if (status === "running") return "#4da3ff";
        if (status === "completed") return "#3ddc97";
        if (status === "failed") return "#ff6b6b";
        return "#f7c948";
      };

      const taskList = document.getElementById("task-list");
      taskList.innerHTML = tasks.map((task) => `
        <div class="debate-item">
          <div><strong>#${task.id}</strong> ${task.description}</div>
          <div class="muted">source=${task.source} · <span style="color:${statusColor(task.status)}">status=${task.status}</span></div>
          <div class="muted">created=${task.created_at}</div>
          ${task.requires_approval ? `<button class="tab-button" onclick="approveTask(${task.id})">승인</button>` : ""}
        </div>
      `).join("");

      const skillsList = document.getElementById("skills-list");
      skillsList.innerHTML = skills.map((skill) => `
        <div class="debate-item">
          <div><strong>${skill.tool_name}</strong></div>
          <div class="muted">success=${skill.success_count}</div>
          <div class="muted">auto_approved=${skill.auto_approved}</div>
          <div class="muted">last_used=${skill.last_used || "-"}</div>
        </div>
      `).join("");

      const unresolvedList = document.getElementById("unresolved-list");
      unresolvedList.innerHTML = unresolved.map((item) => `
        <div class="debate-item">
          <div><strong>#${item.id}</strong> ${item.task}</div>
          <div class="muted">retry=${item.retry_count}/${item.max_retries} · status=${item.status}</div>
          <div>${item.error || ""}</div>
        </div>
      `).join("");
    }

    async function loadChannelStatus() {
      const status = await fetchJson("/api/channel-status");
      document.getElementById("telegram-status").textContent = `Telegram: ${status.telegram}`;
    }

    async function refreshAll() {
      try {
        await Promise.all([loadAudit(), loadDebates(), loadBudget(), loadTasks(), loadChannelStatus()]);
      } catch (error) {
        console.error(error);
      }
    }

    document.getElementById("audit-filter").addEventListener("change", loadAudit);
    document.getElementById("audit-limit").addEventListener("change", loadAudit);

    refreshAll();
    setInterval(refreshAll, 5000);
  </script>
</body>
</html>
