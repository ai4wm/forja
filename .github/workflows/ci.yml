name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libxdo-dev libssl-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-composite0-dev libwayland-dev libwayland-client0 pkg-config libpipewire-0.3-dev libspa-0.2-dev libclang-dev

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Build workspace
      run: cargo build --workspace --no-default-features

    - name: Run clippy
      run: cargo clippy --workspace --no-default-features

    - name: Run tests
      run: cargo test --workspace --exclude forja-llm --no-default-features

