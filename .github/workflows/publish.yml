name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev \
            libssl-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-composite0-dev \
            libwayland-dev \
            libwayland-client0 \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Publish or dry-run crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          publish_crate() {
            local package="$1"
            if [[ "${DRY_RUN}" == "true" ]]; then
              cargo package --workspace --allow-dirty --no-verify
              return 0
            else
              cargo publish -p "${package}" --token "${CARGO_REGISTRY_TOKEN}"
              sleep 30
            fi
          }

          if [[ "${DRY_RUN}" != "true" && -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for a real publish."
            exit 1
          fi

          if [[ "${DRY_RUN}" == "true" ]]; then
            publish_crate forja-core
            cargo build -p forja --no-default-features
          else
            publish_crate forja-core
            publish_crate forja-llm
            publish_crate forja-memory
            publish_crate forja-channel
            publish_crate forja-tools
            publish_crate forja
          fi
