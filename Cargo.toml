[workspace]
members = [
    "crates/forja-core",
    "crates/forja-llm",
    "crates/forja-memory",
    "crates/forja-channel",
    "crates/forja-tools",
]

[package]
name = "forja"
version = "0.1.2"
edition = "2024"
rust-version = "1.87"
description = "Lightweight AI Agent Engine Core Framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai4wm/forja"
homepage = "https://github.com/ai4wm/forja"
documentation = "https://docs.rs/forja"
readme = "README.md"
keywords = ["ai", "agent", "llm", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
forja-core = { version = "0.1.2", path = "crates/forja-core", features = ["runtime", "memory"] }
forja-llm  = { version = "0.1.2", path = "crates/forja-llm" }
forja-memory = { version = "0.1.2", path = "crates/forja-memory" }
forja-tools = { version = "0.1.2", path = "crates/forja-tools", default-features = false }
forja-channel = { version = "0.1.2", path = "crates/forja-channel" }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
indicatif = "0.17"
async-trait = "0.1"
ctrlc = "3.4"
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
dirs-next = "2.0"
serde = { version = "1", features = ["derive"] }
dialoguer = "0.11"
base64 = "0.22.1"
axum = "0.7"
open = "5.3.3"
rand = "0.8"
reqwest = { version = "0.13.2", features = ["json", "form"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
url = "2.5.8"
sha2 = "0.10.9"
serde_json = "1.0.149"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
tower = "0.5"

[features]
default = ["telegram", "browser", "vision", "notification"]
telegram = ["forja-channel/telegram"]
discord = ["forja-channel/discord"]
browser = ["forja-tools/browser"]
vision = ["forja-tools/vision"]
voice = ["forja-channel/voice"]
tui = ["dep:ratatui", "dep:crossterm"]
notification = ["forja-channel/notification"]

[package.metadata.docs.rs]
all-features = true

