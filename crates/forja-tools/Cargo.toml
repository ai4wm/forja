[package]
name = "forja-tools"
version = "0.2.0"
edition = "2024"
description = "Tool execution and function calling toolkit for Forja framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai4wm/forja"

[dependencies]
forja-core = { version = "0.1.1", path = "../forja-core" }
tokio = { version = "1.0", features = ["fs", "io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
url = "2.5.8"
enigo = "0.2"
chromiumoxide = "0.7.0"
base64 = "0.22"
futures = "0.3"
xcap = { version = "0.6.2", optional = true }
image = { version = "0.25", optional = true }

[features]
default = ["vision"]
vision = ["dep:xcap", "dep:image"]


