[package]
name = "forja-tools"
version = "0.1.2"
edition = "2024"
rust-version = "1.87"
description = "Tool execution and function calling toolkit for Forja framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai4wm/forja"
homepage = "https://github.com/ai4wm/forja"
documentation = "https://docs.rs/forja-tools"
keywords = ["ai", "agent", "tools", "mcp", "forja"]
categories = ["development-tools", "asynchronous"]

[dependencies]
forja-core = { version = "0.1.2", path = "../forja-core" }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
url = "2.5.8"
enigo = "0.2"
chromiumoxide = { version = "0.7.0", optional = true }
base64 = "0.22"
futures = "0.3"
xcap = { version = "0.6.2", optional = true }
image = { version = "0.25", optional = true }

[features]
default = ["browser", "vision"]
browser = ["dep:chromiumoxide"]
vision = ["dep:xcap", "dep:image"]

[package.metadata.docs.rs]
all-features = true

